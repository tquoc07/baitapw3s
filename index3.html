<!DOCTYPE html>
<html>
<body>

<script>
    // Hoat dong 2 bai tap 2

    let diem = Number(prompt("Nhap diem cua ban (0-10):"));

    if (isNaN(diem) || diem < 0 || diem > 10) {
        alert("Diem khong hop le!");
    } else if (diem >= 8) {
        alert("Xep loai: Gioi");
    } else if (diem >= 6.5) {
        alert("Xep loai: Kha");
    } else if (diem >= 5) {
        alert("Xep loai: Trung binh");
    } else {
        alert("Xep loai: Yeu");
    }
</script>

</body>
</html>
